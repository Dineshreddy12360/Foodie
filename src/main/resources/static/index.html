<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Food Ordering System</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E8593C;
            --primary-dark: #c44a30;
            --bg: #fdf6f0;
            --card-bg: rgba(255,255,255,0.92);
            --text: #2d1a0e;
            --muted: #888;
            --shadow: 0 4px 24px rgba(232,89,60,0.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #1a0a00;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(232,89,60,0.18) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(255,180,50,0.13) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='40' font-size='28' opacity='0.10'%3E🍕%3C/text%3E%3Ctext x='65' y='80' font-size='22' opacity='0.08'%3E🍔%3C/text%3E%3Ctext x='5' y='100' font-size='20' opacity='0.07'%3E🌮%3C/text%3E%3Ctext x='75' y='25' font-size='18' opacity='0.08'%3E🍜%3C/text%3E%3C/svg%3E");
            background-size: auto, auto, 120px 120px;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(26,10,0,0.82) 0%, rgba(40,15,5,0.78) 50%, rgba(26,10,0,0.85) 100%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 2;
            background: linear-gradient(90deg, #E8593C 0%, #ff8c42 100%);
            color: white;
            padding: 28px 20px 22px;
            text-align: center;
            box-shadow: 0 4px 32px rgba(232,89,60,0.35);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.18);
        }

        header p {
            font-size: 15px;
            margin-top: 6px;
            opacity: 0.92;
            letter-spacing: 1px;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 36px auto;
            padding: 0 20px;
        }

        .section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.22), 0 2px 8px rgba(232,89,60,0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.7);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-bottom: 18px;
            font-size: 22px;
        }

        .add-food-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .add-food-bar input { padding: 9px 12px; border: 1.5px solid #e8d5cc; border-radius: 8px; font-size: 14px; background: #fff8f5; color: var(--text); transition: border 0.2s; }
        .add-food-bar input:focus { outline: none; border-color: var(--primary); }
        .add-food-bar input#newName { width: 130px; }
        .add-food-bar input#newCategory { width: 130px; }
        .add-food-bar input#newPrice { width: 90px; }
        .add-food-bar input#newImageUrl { width: 220px; }
        .add-food-bar button {
            background: linear-gradient(90deg, #E8593C, #ff8c42);
            color: white; border: none; padding: 9px 18px;
            border-radius: 8px; cursor: pointer; font-size: 14px;
            font-weight: 600; letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(232,89,60,0.25);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .add-food-bar button:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(232,89,60,0.35); }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }

        .food-card {
            border: 1px solid #f0e0d8;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            background: white;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 10px rgba(232,89,60,0.07);
        }
        .food-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(232,89,60,0.15); }
        .food-card img { width: 100%; height: 150px; object-fit: cover; }
        .food-card .card-body { padding: 14px; }
        .food-card h3 { color: #333; font-size: 15px; margin-bottom: 5px; font-weight: 600; }
        .food-card p { color: var(--muted); font-size: 13px; }
        .food-card .price { color: var(--primary); font-size: 20px; font-weight: 700; margin: 8px 0; font-family: 'Playfair Display', serif; }
        .food-card .btn-order {
            background: linear-gradient(90deg, #E8593C, #ff8c42);
            color: white; border: none; padding: 9px 16px;
            border-radius: 7px; cursor: pointer; width: 100%; margin-bottom: 6px;
            font-weight: 600; font-size: 14px; transition: opacity 0.15s;
        }
        .food-card .btn-order:hover { opacity: 0.88; }
        .food-card .btn-delete { background: #ff4444; color: white; border: none; padding: 8px 16px; border-radius: 7px; cursor: pointer; width: 100%; font-size: 13px; transition: background 0.15s; }
        .food-card .btn-delete:hover { background: #cc0000; }

        form input {
            width: 100%; padding: 11px 14px; margin-bottom: 12px;
            border: 1.5px solid #e8d5cc; border-radius: 8px; font-size: 14px;
            background: #fff8f5; color: var(--text); transition: border 0.2s;
        }
        form input:focus { outline: none; border-color: var(--primary); }
        form button {
            background: linear-gradient(90deg, #E8593C, #ff8c42);
            color: white; border: none; padding: 13px 28px;
            border-radius: 8px; cursor: pointer; font-size: 15px;
            font-weight: 700; letter-spacing: 0.5px;
            box-shadow: 0 2px 12px rgba(232,89,60,0.25);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        form button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,89,60,0.35); }

        table { width: 100%; border-collapse: collapse; }
        table th { background: linear-gradient(90deg, #E8593C, #ff8c42); color: white; padding: 12px 10px; text-align: left; font-weight: 600; }
        table th:first-child { border-radius: 8px 0 0 0; }
        table th:last-child { border-radius: 0 8px 0 0; }
        table td { padding: 11px 10px; border-bottom: 1px solid #f5e8e4; }
        table tr:hover { background: #fff5f3; }

        .badge {
            background: #fff0eb; color: var(--primary);
            padding: 3px 10px; border-radius: 20px; font-size: 12px;
            font-weight: 600; border: 1px solid #ffd6cc;
        }
    </style>
</head>
<body>

<header>
    <h1>🍕 Foodie</h1>
    <p>Order your favourite food!!</p>
</header>

<div class="container">

    <!-- Menu Section -->
    <div class="section">
        <h2>🍽️ Our Menu</h2>
        <div class="add-food-bar">
            <input type="text" id="newName" placeholder="Food Name"/>
            <input type="text" id="newCategory" placeholder="Category"/>
            <input type="number" id="newPrice" placeholder="Price"/>
            <input type="text" id="newImageUrl" placeholder="Paste Image URL here"/>
            <button onclick="addFood()">Add Food</button>
        </div>
        <div class="menu-grid" id="menuGrid">
            <p>Loading menu...</p>
        </div>
    </div>

    <!-- Place Order Section -->
    <div class="section">
        <h2>🛒 Place Order</h2>
        <form id="orderForm">
            <input type="text" id="customerName" placeholder="Your Name" required />
            <input type="text" id="foodItemName" placeholder="Food Item Name" required />
            <input type="number" id="quantity" placeholder="Quantity" min="1" required />
            <input type="number" id="totalPrice" placeholder="Total Price" required />
            <button type="submit">Place Order</button>
        </form>
    </div>

    <!-- Orders Section -->
    <div class="section">
        <h2>📦 All Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Food Item</th>
                    <th>Quantity</th>
                    <th>Total Price</th>
                    <th>Order Time</th>
                </tr>
            </thead>
            <tbody id="ordersTable">
                <tr><td colspan="6">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    function loadMenu() {
        fetch('/api/fooditems')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('menuGrid');
                grid.innerHTML = '';
                data.forEach(item => {
                    const imgSrc = item.imageUrl && item.imageUrl.trim() !== ''
                        ? item.imageUrl
                        : 'https://placehold.co/210x150?text=' + encodeURIComponent(item.name);
                    grid.innerHTML += `
                        <div class="food-card">
                            <img src="${imgSrc}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/210x150?text=No+Image'"/>
                            <div class="card-body">
                                <h3>${item.name}</h3>
                                <p><span class="badge">${item.category}</span></p>
                                <p class="price">₹${item.price}</p>
                                <button class="btn-order" onclick="selectFood('${item.name}', ${item.price})">Order Now</button>
                                <button class="btn-delete" onclick="deleteFood(${item.id})">Delete</button>
                            </div>
                        </div>`;
                });
            });
    }

    function selectFood(name, price) {
        document.getElementById('foodItemName').value = name;
        document.getElementById('totalPrice').value = price;
        document.getElementById('customerName').focus();
    }

    function loadOrders() {
        fetch('/api/orders')
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById('ordersTable');
                table.innerHTML = '';
                data.forEach(order => {
                    table.innerHTML += `
                        <tr>
                            <td>${order.id}</td>
                            <td>${order.customerName}</td>
                            <td>${order.foodItemName}</td>
                            <td>${order.quantity}</td>
                            <td>₹${order.totalPrice}</td>
                            <td>${new Date(order.orderTime).toLocaleString()}</td>
                        </tr>`;
                });
            });
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const order = {
            customerName: document.getElementById('customerName').value,
            foodItemName: document.getElementById('foodItemName').value,
            quantity: parseInt(document.getElementById('quantity').value),
            totalPrice: parseFloat(document.getElementById('totalPrice').value)
        };
        fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(order)
        }).then(() => {
            alert('Order placed successfully!!');
            loadOrders();
            document.getElementById('orderForm').reset();
        });
    });

    function addFood() {
        const food = {
            name: document.getElementById('newName').value,
            category: document.getElementById('newCategory').value,
            price: parseFloat(document.getElementById('newPrice').value),
            imageUrl: document.getElementById('newImageUrl').value
        };
        fetch('/api/fooditems', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(food)
        }).then(() => {
            alert('Food item added!!');
            loadMenu();
            document.getElementById('newName').value = '';
            document.getElementById('newCategory').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newImageUrl').value = '';
        });
    }

    function deleteFood(id) {
        if(confirm('Are you sure you want to delete this item?')) {
            fetch('/api/fooditems/' + id, {
                method: 'DELETE'
            }).then(() => {
                alert('Food item deleted!!');
                loadMenu();
            });
        }
    }

    loadMenu();
    loadOrders();
</script>

</body>
</html>
